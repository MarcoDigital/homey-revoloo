<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E3EFEA"/>
      <stop offset="1" stop-color="#F6EFE6"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6D7C3"/>
      <stop offset="1" stop-color="#D9C6AD"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFE0F0"/>
      <stop offset="1" stop-color="#E8F5FA"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="700" fill="url(#wall)"/>
  <!-- window -->
  <rect x="690" y="70" width="230" height="250" rx="16" fill="#FFFFFF"/>
  <rect x="706" y="86" width="198" height="218" rx="8" fill="url(#sky)"/>
  <rect x="800" y="86" width="10" height="218" fill="#FFFFFF"/>
  <rect x="706" y="190" width="198" height="10" fill="#FFFFFF"/>
  <ellipse cx="760" cy="140" rx="34" ry="14" fill="#FFFFFF" opacity="0.8"/>
  <!-- floor -->
  <rect x="0" y="540" width="1000" height="160" fill="url(#floor)"/>
  <rect x="0" y="536" width="1000" height="8" fill="#FFFFFF" opacity="0.7"/>
  <!-- plant -->
  <g>
    <path d="M70 380 C 40 300 60 250 90 230 C 100 290 95 340 84 384 Z" fill="#5E9C7E"/>
    <path d="M92 384 C 110 300 150 270 190 268 C 170 320 140 360 100 388 Z" fill="#4A8C7B"/>
    <path d="M80 386 C 40 340 10 330 -10 336 C 10 370 40 390 76 392 Z" fill="#6FAE8E"/>
    <path d="M44 384 L132 384 L122 560 L54 560 Z" fill="#D58B6A"/>
    <rect x="38" y="374" width="100" height="22" rx="6" fill="#C77B5A"/>
  </g>
  <!-- litter box -->
  <svg x="150" y="90" width="520" height="520" viewBox="0 0 500 500">
  <!-- Revoloo One: a drum lying on its side in a curved cradle on four legs,
       seen from the front left. Original illustration. -->
  <defs>
    <linearGradient id="lb-body" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#F4F3F0"/>
      <stop offset="1" stop-color="#DEDBD6"/>
    </linearGradient>
    <linearGradient id="lb-front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECEAE6"/>
    </linearGradient>
    <linearGradient id="lb-cradle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E4DFD8"/>
      <stop offset="1" stop-color="#CFC8BF"/>
    </linearGradient>
    <clipPath id="lb-door"><circle cx="196" cy="226" r="78"/></clipPath>
  </defs>
  
  <g transform="translate(30 30) scale(0.88)">

  <!-- mat -->
  <path d="M28 446 L300 446 Q330 446 352 460 L362 470 L40 470 Q18 470 22 458 Z" fill="#A9AEB1"/>
  <path d="M40 452 L300 452 Q322 452 338 462 L50 462 Z" fill="#B9BEC1"/>

  <!-- back legs -->
  <path d="M398 360 L432 430 L446 428 L420 356 Z" fill="#CFC8BF"/>
  <!-- drum body (cylinder going back to the right) -->
  <path d="M196 70 C 330 62 448 116 452 232 C 456 336 370 384 196 382 Z" fill="url(#lb-body)"/>
  <!-- seam between front cap and body -->
  <path d="M244 76 C 300 120 318 300 254 380" fill="none" stroke="#D6D2CC" stroke-width="2"/>
  <!-- control panel on top of the drum -->
  <g transform="translate(330 128) rotate(14)">
    <rect x="0" y="0" width="92" height="22" rx="6" fill="#EDEBE7" stroke="#D3CEC7" stroke-width="1.5"/>
    <rect x="8" y="7" width="8" height="8" rx="2" fill="#B9B2A8"/>
    <rect x="22" y="7" width="8" height="8" rx="2" fill="#B9B2A8"/>
    <circle cx="40" cy="11" r="4.5" fill="#B9B2A8"/>
    <rect x="58" y="5" width="28" height="12" rx="6" fill="#CFC8BF"/>
  </g>
  <!-- cradle: wraps the lower part of the drum; drawn over the body and
       behind the front cap, so the drum sits in it -->
  <path d="M60 280 C 150 360 260 352 350 322 C 410 300 446 268 466 236 L 474 268 C 455 360 400 412 330 428 C 210 450 90 425 52 300 Z" fill="url(#lb-cradle)"/>
  <path d="M60 280 C 150 360 260 352 350 322 C 410 300 446 268 466 236" fill="none" stroke="#F4F1EC" stroke-width="3"/>
  <!-- front cap -->
  <circle cx="196" cy="226" r="156" fill="url(#lb-front)" stroke="#E2DFDA" stroke-width="2"/>
  <!-- entrance with taupe rim -->
  <circle cx="196" cy="226" r="96" fill="#CDC3B6"/>
  <circle cx="196" cy="226" r="80" fill="#C2B7A9"/>
  <circle cx="196" cy="226" r="78" fill="#3B4044"/>
  <g clip-path="url(#lb-door)">
    <rect x="110" y="150" width="172" height="70" fill="#4A5055"/>
    <path d="M100 262 Q196 244 292 262 L292 320 L100 320 Z" fill="#2E3236"/>
    <g stroke="#5B6166" stroke-width="3">
      <path d="M110 270 L282 270"/><path d="M110 282 L282 282"/><path d="M110 294 L282 294"/>
      <path d="M140 262 L140 310"/><path d="M168 258 L168 310"/><path d="M196 256 L196 310"/>
      <path d="M224 258 L224 310"/><path d="M252 262 L252 310"/>
    </g>
  </g>

  <!-- display on the cradle -->
  <rect x="176" y="414" width="44" height="22" rx="4" fill="#EFECE8" stroke="#CFC8BF" stroke-width="1.5"/>
  <rect x="190" y="418" width="16" height="14" rx="2" fill="#3B4044"/>

  <!-- front legs -->
  <path d="M100 400 L74 458 L90 460 L120 406 Z" fill="#D9D3CB"/>
  <path d="M286 426 L290 474 L306 474 L304 424 Z" fill="#D9D3CB"/>
  </g>
</svg>
  <!-- cat -->
  <svg x="590" y="226" width="390" height="390" viewBox="0 0 500 500">
  
  <ellipse cx="250" cy="452" rx="150" ry="13" fill="#000" opacity="0.07"/>
  <!-- tail -->
  <path d="M318 440 C 398 446 430 380 392 330" fill="none" stroke="#7D858C" stroke-width="26" stroke-linecap="round"/>
  <!-- body -->
  <path d="M168 446 C 150 350 176 262 250 250 C 324 262 350 350 332 446 Z" fill="#9AA2A9"/>
  <path d="M212 446 C 205 380 222 320 250 312 C 278 320 295 380 288 446 Z" fill="#C9CED3"/>
  <!-- front paws -->
  <ellipse cx="222" cy="444" rx="24" ry="12" fill="#B8BEC4"/>
  <ellipse cx="278" cy="444" rx="24" ry="12" fill="#B8BEC4"/>
  <!-- head -->
  <circle cx="250" cy="190" r="86" fill="#9AA2A9"/>
  <!-- folded ears (Scottish fold) -->
  <path d="M180 140 Q182 104 222 112 Q206 128 196 150 Z" fill="#878F96"/>
  <path d="M320 140 Q318 104 278 112 Q294 128 304 150 Z" fill="#878F96"/>
  <!-- face -->
  <ellipse cx="250" cy="222" rx="46" ry="34" fill="#C9CED3"/>
  <ellipse cx="216" cy="186" rx="15" ry="17" fill="#E3B341"/>
  <ellipse cx="284" cy="186" rx="15" ry="17" fill="#E3B341"/>
  <ellipse cx="216" cy="188" rx="5" ry="13" fill="#2B2F33"/>
  <ellipse cx="284" cy="188" rx="5" ry="13" fill="#2B2F33"/>
  <path d="M240 210 L260 210 L250 222 Z" fill="#D98E95"/>
  <path d="M250 222 Q240 236 230 230 M250 222 Q260 236 270 230" fill="none" stroke="#5E666C" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#6F777D" stroke-width="2.5" stroke-linecap="round">
    <path d="M204 216 L150 206"/><path d="M204 226 L152 230"/>
    <path d="M296 216 L350 206"/><path d="M296 226 L348 230"/>
  </g>
</svg>
</svg>