<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E3EFEA"/>
      <stop offset="1" stop-color="#F6EFE6"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6D7C3"/>
      <stop offset="1" stop-color="#D9C6AD"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFE0F0"/>
      <stop offset="1" stop-color="#E8F5FA"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="700" fill="url(#wall)"/>
  <!-- window -->
  <rect x="690" y="70" width="230" height="250" rx="16" fill="#FFFFFF"/>
  <rect x="706" y="86" width="198" height="218" rx="8" fill="url(#sky)"/>
  <rect x="800" y="86" width="10" height="218" fill="#FFFFFF"/>
  <rect x="706" y="190" width="198" height="10" fill="#FFFFFF"/>
  <ellipse cx="760" cy="140" rx="34" ry="14" fill="#FFFFFF" opacity="0.8"/>
  <!-- floor -->
  <rect x="0" y="540" width="1000" height="160" fill="url(#floor)"/>
  <rect x="0" y="536" width="1000" height="8" fill="#FFFFFF" opacity="0.7"/>
  <!-- plant -->
  <g>
    <path d="M70 380 C 40 300 60 250 90 230 C 100 290 95 340 84 384 Z" fill="#5E9C7E"/>
    <path d="M92 384 C 110 300 150 270 190 268 C 170 320 140 360 100 388 Z" fill="#4A8C7B"/>
    <path d="M80 386 C 40 340 10 330 -10 336 C 10 370 40 390 76 392 Z" fill="#6FAE8E"/>
    <path d="M44 384 L132 384 L122 560 L54 560 Z" fill="#D58B6A"/>
    <rect x="38" y="374" width="100" height="22" rx="6" fill="#C77B5A"/>
  </g>
  <!-- litter box -->
  <svg x="150" y="90" width="520" height="520" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="lb-drum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E8EC"/>
    </linearGradient>
    <linearGradient id="lb-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1F3F5"/>
      <stop offset="1" stop-color="#D9DEE3"/>
    </linearGradient>
    <clipPath id="lb-door"><ellipse cx="232" cy="222" rx="92" ry="104"/></clipPath>
  </defs>
  
  <ellipse cx="250" cy="452" rx="178" ry="14" fill="#000" opacity="0.07"/>
  <!-- base with waste drawer -->
  <rect x="82" y="352" width="336" height="92" rx="26" fill="url(#lb-base)" stroke="#C9CFD5" stroke-width="2"/>
  <rect x="146" y="378" width="208" height="42" rx="12" fill="#E6EAEE" stroke="#C9CFD5" stroke-width="2"/>
  <rect x="226" y="394" width="48" height="8" rx="4" fill="#C3CAD1"/>
  <!-- drum -->
  <circle cx="250" cy="208" r="168" fill="url(#lb-drum)" stroke="#CDD3D9" stroke-width="3"/>
  <!-- entrance -->
  <ellipse cx="232" cy="222" rx="92" ry="104" fill="#2E3A40"/>
  <g clip-path="url(#lb-door)">
    <path d="M120 282 Q232 256 344 282 L344 340 L120 340 Z" fill="#D9C7A6"/>
    <path d="M120 282 Q232 256 344 282" fill="none" stroke="#C7B28C" stroke-width="4"/>
    <ellipse cx="200" cy="160" rx="60" ry="40" fill="#FFFFFF" opacity="0.06"/>
  </g>
  <ellipse cx="232" cy="222" rx="92" ry="104" fill="none" stroke="#4A8C7B" stroke-width="12"/>
  <!-- status light -->
  <rect x="340" y="120" width="10" height="40" rx="5" fill="#4A8C7B" opacity="0.85"/>
</svg>
  <!-- cat -->
  <svg x="590" y="226" width="390" height="390" viewBox="0 0 500 500">
  
  <ellipse cx="250" cy="452" rx="150" ry="13" fill="#000" opacity="0.07"/>
  <!-- tail -->
  <path d="M318 440 C 398 446 430 380 392 330" fill="none" stroke="#7D858C" stroke-width="26" stroke-linecap="round"/>
  <!-- body -->
  <path d="M168 446 C 150 350 176 262 250 250 C 324 262 350 350 332 446 Z" fill="#9AA2A9"/>
  <path d="M212 446 C 205 380 222 320 250 312 C 278 320 295 380 288 446 Z" fill="#C9CED3"/>
  <!-- front paws -->
  <ellipse cx="222" cy="444" rx="24" ry="12" fill="#B8BEC4"/>
  <ellipse cx="278" cy="444" rx="24" ry="12" fill="#B8BEC4"/>
  <!-- head -->
  <circle cx="250" cy="190" r="86" fill="#9AA2A9"/>
  <!-- folded ears (Scottish fold) -->
  <path d="M180 140 Q182 104 222 112 Q206 128 196 150 Z" fill="#878F96"/>
  <path d="M320 140 Q318 104 278 112 Q294 128 304 150 Z" fill="#878F96"/>
  <!-- face -->
  <ellipse cx="250" cy="222" rx="46" ry="34" fill="#C9CED3"/>
  <ellipse cx="216" cy="186" rx="15" ry="17" fill="#E3B341"/>
  <ellipse cx="284" cy="186" rx="15" ry="17" fill="#E3B341"/>
  <ellipse cx="216" cy="188" rx="5" ry="13" fill="#2B2F33"/>
  <ellipse cx="284" cy="188" rx="5" ry="13" fill="#2B2F33"/>
  <path d="M240 210 L260 210 L250 222 Z" fill="#D98E95"/>
  <path d="M250 222 Q240 236 230 230 M250 222 Q260 236 270 230" fill="none" stroke="#5E666C" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#6F777D" stroke-width="2.5" stroke-linecap="round">
    <path d="M204 216 L150 206"/><path d="M204 226 L152 230"/>
    <path d="M296 216 L350 206"/><path d="M296 226 L348 230"/>
  </g>
</svg>
</svg>